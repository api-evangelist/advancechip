aid: advancechip
name: Advancechip Technology (Hunan) Co., Ltd.
description: >-
  Advancechip Technology (Hunan) Co., Ltd. — 进芯科技（湖南）股份有限公司, formerly Hunan Jinxin Electronic
  Technology Co., Ltd. — is a fabless integrated-circuit design company founded in October 2012 and
  headquartered in Changsha, Hunan, China. It develops digital signal processor (DSP) chips and
  embedded solutions, and states that it has taken three DSP families to mass production: 16-bit
  fixed-point (ADP16), 32-bit fixed-point (ADP32) and 32-bit floating-point (AVP32), alongside
  single-core and multi-core SoC parts such as the ADM32F036 motor-control family. The company
  describes its core technologies as DSP core design, compilation technology, large-scale SoC
  digital integration and core drive algorithms, held as a fully independent intellectual-property
  stack, and targets automotive electronics, thermal management, smart home and white goods, small
  household appliances, health equipment and power tools. Its developer-facing surface is hardware,
  not web software: evaluation and development boards (AVP32F379QP176, AVP32F00157QP80,
  AVP32F0039QP100S, ADM32F036A5Q/A6Q/A7Q low-voltage motor boards), a technical-support page and a
  download section that serves chip data manuals as PDFs from a third-party file host. As probed on
  2026-09-07 Advancechip publishes no public web API, no developer portal or API reference, no
  OpenAPI/AsyncAPI/GraphQL contract, no SDK in any public package registry, no GitHub organization
  and no /.well-known documents; the corporate site itself is served over plaintext HTTP only.
